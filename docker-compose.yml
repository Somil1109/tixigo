name: tixigo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tixigo
      POSTGRES_USER: tixigo
      POSTGRES_PASSWORD: tixigo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tixigo -d tixigo"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
